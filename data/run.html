<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Batch Flow – Run</title>
    <link rel="stylesheet" href="styles.css?v=2026-05-09-2">
    <script src="app.js?v=2026-05-09-2" defer></script>
</head>
<body>
    <div class="wrap">
        <header>
            <div class="topbar">
                <div>
                    <h1>Batch Run</h1>
                    <p class="muted">Dispense by gallons • Sensor 1 (GPIO2) pulses • Relay-driven valve</p>
                </div>
                <nav class="nav">
                    <a class="navlink" href="/setup.html">Setup</a>
                    <a class="navlink active" href="/run.html">Run</a>
                    <a class="navlink" href="/diagnostics.html">Diagnostics</a>
                </nav>
            </div>
        </header>

        <section class="card">
            <h2 style="display:flex; align-items:center; gap:10px">
                <span>Batch Run</span>
                <span id="connDot" title="Connection" style="width:10px; height:10px; border-radius:50%; display:inline-block; background:#9aa0a6"></span>
                <span id="connText" class="muted" style="font-size:13px">disconnected</span>
            </h2>
            <div class="row">
                <label>
                    Product
                    <select id="runProduct"></select>
                </label>
                <label>
                    Gallons
                    <input id="runGallons" type="number" step="0.01" min="0" placeholder="1.00" />
                </label>
                <button id="runStart" class="btn primary">Start</button>
                <button id="runStop" class="btn danger">Stop</button>
                <button id="runReset" class="btn">Reset</button>
            </div>
            <div class="row" style="align-items:center; gap:12px; margin-top:10px">
                <div style="flex:1">
                    <div class="label" style="margin-bottom:6px">Progress</div>
                    <progress id="runProgress" value="0" max="100" style="width:100%; height:18px"></progress>
                </div>
                <div class="stat" style="min-width:180px">
                    <div class="label">Remaining</div>
                    <div class="value" id="runRemain">—</div>
                </div>
            </div>
            <div class="muted" id="runStatus"></div>
        </section>

        <section class="card">
            <h2>Live Pulses</h2>
            <div class="grid2">
                <div class="stat">
                    <div class="label">Sensor 1 (GPIO2)</div>
                    <div class="value" id="p1">0</div>
                </div>
                <div class="stat">
                    <div class="label">Sensor 2 (GPIO3)</div>
                    <div class="value" id="p2">0</div>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>Valve Control (Relays)</h2>
            <p class="muted">Quick test tools. 0 = open, 9000 = closed (degrees × 100).</p>
            <div class="row">
                <button id="valveOpen" class="btn primary">Open</button>
                <button id="valveClose" class="btn danger">Close</button>

                <label>
                    Set position (deg×100)
                    <input id="valveDeg100" type="number" step="1" placeholder="0 or 9000" />
                </label>
                <button id="valveSet" class="btn">Set</button>

                <button id="valveClearErr" class="btn">Clear error</button>
            </div>
            <div class="muted" id="valveStatus"></div>
        </section>

        <footer class="muted" style="margin:14px 4px" id="uiVersion">UI version: …</footer>
    </div>
</body>
</html>
